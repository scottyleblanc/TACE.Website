# Runs the gate on every pull request into main: every check, plus the unit tests and the
# Hugo site build (-Unit, Gate/Invoke-UnitTest.ps1). The job 'gate' is a required status
# check on main, so a failing pull request cannot merge, and nothing reaches deploy.yml
# without passing it.
#
# Adapted from tools/gate/Templates/github/gate.yml: adds the theme submodule, Python and
# Hugo, which the unit script needs.
#
# [SEC] Least privilege: a read-only token, no secrets, no write-capable trigger
# (pull_request, never pull_request_target), the token is not kept in the checkout, and
# every action used is pinned to a full commit SHA.

name: gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The pull request head, not GitHub's merge commit: the commit checks then see
      # exactly the pull request's own commits. The full history gives origin/<base>
      # for -Base. The theme submodule is needed for the Hugo build.
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the test packages
        run: python -m pip install --quiet --require-hashes -r .github/requirements/ci.txt

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: '0.158.0'
          extended: true

      - name: Install tools and run the gate
        shell: pwsh
        env:
          GATE_BASE: origin/${{ github.base_ref }}
        run: |
          & ./tools/gate/Scripts/Install-GateTool.ps1 -Destination (Join-Path -Path $env:RUNNER_TEMP -ChildPath 'gate-tools')
          & ./tools/gate/Scripts/Invoke-Gate.ps1 -Unit -Base $env:GATE_BASE -Timestamp
          exit $LASTEXITCODE
