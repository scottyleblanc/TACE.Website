name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Gate: econ Lambda + dashboard-contract tests must pass before anything deploys.
      # Offline only — live upstream contract tests (-m live) are excluded by pytest.ini.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # [SEC] Every pip install runs before "Configure AWS credentials", from a hashed
      # requirements file (--require-hashes); Gate/Invoke-UnitTest.ps1 enforces both.
      - name: Test econ and tracker Lambdas
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements/ci.txt
          python -m pytest app/econ -q
          python -m pytest app/train -q

      - name: Install Anthropic SDK for the tracker-coach layer
        run: |
          python -m pip install --require-hashes --no-deps -r app/train/lambda/requirements-coach.txt \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --only-binary=:all: \
            --target layer/python \
            --no-cache-dir

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: '0.158.0'
          extended: true

      - name: Build
        run: hugo --source hugo --minify --baseURL "${{ vars.SITE_URL }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Deploy to S3
        run: |
          aws s3 sync hugo/public/ s3://${{ vars.S3_BUCKET_NAME }}/tacedata-site/ --delete --exclude "data/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deploy Lambda
        run: |
          zip -j function.zip app/econ/lambda/indicators.py
          aws lambda update-function-code \
            --function-name ${{ vars.ECON_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --region ca-central-1

      - name: Generate Tracker config
        env:
          TRACKER_API_BASE: ${{ vars.TRACKER_API_BASE }}
        run: |
          printf 'export const API = "%s";\n' "$TRACKER_API_BASE" > app/train/src/config.js

      - name: Deploy Tracker SPA to S3
        run: |
          aws s3 sync app/train/src/ s3://${{ vars.TRACKER_S3_BUCKET }}/ --delete --cache-control "no-cache"

      - name: Invalidate Tracker CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.TRACKER_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Update tracker-api Lambda
        run: |
          zip -j tracker-api.zip app/train/lambda/days_api.py app/train/lambda/plan_merge.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_API }} \
            --zip-file fileb://tracker-api.zip \
            --region ca-central-1

      - name: Update tracker-email Lambda
        run: |
          zip -j tracker-email.zip app/train/lambda/daily_email.py app/train/lambda/plan_merge.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_EMAIL }} \
            --zip-file fileb://tracker-email.zip \
            --region ca-central-1

      - name: Update tracker-auth Lambda
        run: |
          zip -j tracker-auth.zip app/train/lambda/tracker_auth.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_AUTH }} \
            --zip-file fileb://tracker-auth.zip \
            --region ca-central-1

      - name: Publish Anthropic SDK layer for tracker-coach
        run: |
          cd layer && zip -r ../anthropic-layer.zip python && cd ..
          LAYER_VERSION_ARN=$(aws lambda publish-layer-version \
            --layer-name tracker-coach-anthropic-sdk \
            --description "Anthropic Python SDK for the tracker-coach Lambda" \
            --zip-file fileb://anthropic-layer.zip \
            --compatible-runtimes python3.12 \
            --compatible-architectures x86_64 \
            --region ca-central-1 \
            --query "LayerVersionArn" --output text)
          aws lambda update-function-configuration \
            --function-name ${{ vars.TRACKER_LAMBDA_COACH }} \
            --layers "$LAYER_VERSION_ARN" \
            --region ca-central-1
          aws lambda wait function-updated \
            --function-name ${{ vars.TRACKER_LAMBDA_COACH }} \
            --region ca-central-1

      - name: Update tracker-coach Lambda
        run: |
          zip -j tracker-coach.zip app/train/lambda/tracker_coach.py app/train/lambda/plan_merge.py app/train/lambda/coach_prompts.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_COACH }} \
            --zip-file fileb://tracker-coach.zip \
            --region ca-central-1
