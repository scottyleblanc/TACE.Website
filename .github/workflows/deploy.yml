name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.158.0'
          extended: true

      - name: Build
        run: hugo --source hugo --minify --baseURL "${{ vars.SITE_URL }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Deploy to S3
        run: |
          aws s3 sync hugo/public/ s3://${{ vars.S3_BUCKET_NAME }}/tacedata-site/ --delete --exclude "data/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deploy Lambda
        run: |
          zip -j function.zip app/econ/lambda/indicators.py
          aws lambda update-function-code \
            --function-name ${{ vars.ECON_LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --region ca-central-1

      - name: Generate Tracker config
        env:
          TRACKER_API_BASE: ${{ vars.TRACKER_API_BASE }}
        run: |
          printf 'export const API = "%s";\n' "$TRACKER_API_BASE" > app/train/src/config.js

      - name: Deploy Tracker SPA to S3
        run: |
          aws s3 sync app/train/src/ s3://${{ vars.TRACKER_S3_BUCKET }}/ --delete

      - name: Invalidate Tracker CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.TRACKER_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Update tracker-api Lambda
        run: |
          zip -j tracker-api.zip app/train/lambda/days_api.py app/train/lambda/plan_merge.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_API }} \
            --zip-file fileb://tracker-api.zip \
            --region ca-central-1

      - name: Update tracker-email Lambda
        run: |
          zip -j tracker-email.zip app/train/lambda/daily_email.py app/train/lambda/plan_merge.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_EMAIL }} \
            --zip-file fileb://tracker-email.zip \
            --region ca-central-1

      - name: Update tracker-auth Lambda
        run: |
          zip -j tracker-auth.zip app/train/lambda/tracker_auth.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_AUTH }} \
            --zip-file fileb://tracker-auth.zip \
            --region ca-central-1

      - name: Build and publish Anthropic SDK layer for tracker-coach
        run: |
          pip install anthropic \
            --platform manylinux2014_x86_64 \
            --python-version 3.12 \
            --implementation cp \
            --only-binary=:all: \
            --target layer/python \
            --no-cache-dir
          cd layer && zip -r ../anthropic-layer.zip python && cd ..
          LAYER_VERSION_ARN=$(aws lambda publish-layer-version \
            --layer-name tracker-coach-anthropic-sdk \
            --description "Anthropic Python SDK for the tracker-coach Lambda" \
            --zip-file fileb://anthropic-layer.zip \
            --compatible-runtimes python3.12 \
            --compatible-architectures x86_64 \
            --region ca-central-1 \
            --query "LayerVersionArn" --output text)
          aws lambda update-function-configuration \
            --function-name ${{ vars.TRACKER_LAMBDA_COACH }} \
            --layers "$LAYER_VERSION_ARN" \
            --region ca-central-1
          aws lambda wait function-updated \
            --function-name ${{ vars.TRACKER_LAMBDA_COACH }} \
            --region ca-central-1

      - name: Update tracker-coach Lambda
        run: |
          zip -j tracker-coach.zip app/train/lambda/tracker_coach.py app/train/lambda/plan_merge.py app/train/lambda/coach_prompts.py
          aws lambda update-function-code \
            --function-name ${{ vars.TRACKER_LAMBDA_COACH }} \
            --zip-file fileb://tracker-coach.zip \
            --region ca-central-1
