<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <p id="app-error" class="app-error" style="display:none"></p>

    <p id="app-loading" class="app-loading">Loading&hellip;</p>

    <div id="login-screen" style="display:none">
      <div class="login-card">
        <h1>Training Tracker</h1>
        <p class="login-sub">Build the habit, one session at a time.</p>
        <button id="login-btn">Login with Google</button>
      </div>
    </div>

    <div id="dashboard" style="display:none">
      <header class="site-header">
        <span class="site-title">Training Tracker</span>
        <div class="header-actions">
          <button id="coach-nav-btn" class="nav-btn">Coach</button>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </header>

      <main>
        <section id="today-card"></section>

        <section class="stats-row">
          <div class="stat-box">
            <span class="stat-label">Current streak</span>
            <span id="streak-count" class="stat-value">0</span>
            <span class="stat-unit">active days</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Block day</span>
            <span id="blockday-value" class="stat-value">--</span>
            <span id="blockday-unit" class="stat-unit"></span>
          </div>
          <div class="stat-box progress-box">
            <div class="progress-header">
              <span class="stat-label">Overall progress</span>
              <span id="progress-fraction" class="stat-value">--</span>
              <span id="progress-pct" class="stat-pct">0%</span>
            </div>
            <div class="progress-track">
              <div id="progress-bar-fill"></div>
            </div>
          </div>
        </section>

        <section class="weekly-section">
          <h2 class="section-title">This week</h2>
          <div id="weekly-row"></div>
          <div id="week-schedule"></div>
        </section>
      </main>
    </div>

    <div id="coach-view" style="display:none">
      <header class="site-header">
        <span class="site-title">Coach</span>
        <div class="header-actions">
          <button id="dashboard-nav-btn" class="nav-btn">Dashboard</button>
          <button id="logout-btn-coach" class="logout-btn">Logout</button>
        </div>
      </header>

      <main class="coach-main">
        <div class="coach-toolbar">
          <select id="thread-select"></select>
          <button id="thread-new-btn" class="coach-tool-btn">+ New</button>
          <button id="thread-rename-btn" class="coach-tool-btn">Rename</button>
          <button id="thread-delete-btn" class="coach-tool-btn coach-tool-danger">Delete</button>
        </div>

        <div class="coach-settings-row">
          <span class="coach-settings-label">Coach mode:</span>
          <div id="scope-toggle" class="scope-toggle">
            <button id="scope-plan-only" class="scope-btn" data-scope="plan_only">Plan only</button>
            <button id="scope-plan-plus-general" class="scope-btn" data-scope="plan_plus_general">Plan + general</button>
          </div>
        </div>

        <div id="coach-messages" class="coach-messages"></div>

        <form id="coach-send-form" class="coach-input-row">
          <textarea id="coach-input" placeholder="Ask your coach..." rows="1"></textarea>
          <button type="submit" id="coach-send-btn">Send</button>
        </form>
      </main>
    </div>

  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
